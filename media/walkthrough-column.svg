<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="600" height="360" fill="#1e1e1e"/>
  <!-- Tab bar -->
  <rect width="600" height="36" fill="#252526"/>
  <rect x="12" y="8" width="80" height="20" rx="4" fill="#37373d"/>
  <text x="52" y="22" text-anchor="middle" fill="#cccccc" font-size="11">My Board</text>
  <!-- + Column button highlighted -->
  <rect x="460" y="7" width="88" height="22" rx="4" fill="#4b0082" stroke="#ee82ee" stroke-width="1.5"/>
  <text x="504" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">+ Column</text>
  <!-- Column 1 -->
  <rect x="20" y="52" width="160" height="280" rx="8" fill="#252526"/>
  <polygon points="35,62.8 39.5,65.4 39.5,70.6 35,73.2 30.5,70.6 30.5,65.4" fill="#3B82F6"/>
  <text x="110" y="76" text-anchor="middle" fill="#cccccc" font-size="12" font-weight="600">To Do</text>
  <!-- Column 2 -->
  <rect x="210" y="52" width="160" height="280" rx="8" fill="#252526"/>
  <polygon points="225,62.8 229.5,65.4 229.5,70.6 225,73.2 220.5,70.6 220.5,65.4" fill="#F59E0B"/>
  <text x="290" y="76" text-anchor="middle" fill="#cccccc" font-size="12" font-weight="600">Doing</text>
  <!-- Column 3 -->
  <rect x="400" y="52" width="160" height="280" rx="8" fill="#252526"/>
  <polygon points="415,62.8 419.5,65.4 419.5,70.6 415,73.2 410.5,70.6 410.5,65.4" fill="#22C55E"/>
  <text x="480" y="76" text-anchor="middle" fill="#cccccc" font-size="12" font-weight="600">Done</text>
  <!-- Arrow pointing to button -->
  <text x="504" y="46" text-anchor="middle" fill="#ee82ee" font-size="18">↑</text>
</svg>
